name: Build Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  check-yarn-constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker build -t verifier .
      - run: docker image tag verifier:latest ghcr.io/nasta-tv/verifier:${{github.ref_name}}-${{github.run_number}}
        if: github.ref_type == 'branch'
      - run: |
          docker image tag verifier:latest ghcr.io/nasta-tv/verifier:latest
          docker image tag verifier:latest ghcr.io/nasta-tv/verifier:${{github.ref_name}}
        if: github.ref_type == 'tag'
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push ghcr.io/nasta-tv/verifier -a
